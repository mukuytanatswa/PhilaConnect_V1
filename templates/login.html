<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhilaConnect — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #FAF7F2;
      --ink: #1A1410;
      --ink-soft: #4A3F35;
      --ink-muted: #8C7B6E;
      --terracotta: #C45C3A;
      --terracotta-light: #F0DDD6;
      --sage: #5C7A5C;
      --border: #E8E0D8;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(26,20,16,0.07);
    }
    .brand {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      color: var(--terracotta);
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--ink-muted);
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: var(--cream);
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--terracotta); background: #fff; }
    button {
      width: 100%;
      padding: 11px;
      background: var(--terracotta);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.88; }
    .error {
      background: var(--terracotta-light);
      color: var(--terracotta);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">PhilaConnect</div>
    <div class="subtitle">Clinic Dashboard — Sign In</div>

    {% if request.query_params.get('error') %}
    <div class="error">Incorrect username or password.</div>
    {% endif %}

    <form method="post" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">Password</label>
      <div style="position:relative;">
        <input type="password" id="password" name="password" autocomplete="current-password" required style="margin-bottom:18px;padding-right:42px;">
        <span onclick="const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈';" style="position:absolute;right:12px;top:10px;cursor:pointer;font-size:16px;user-select:none;">👁</span>
      </div>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
